<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Recorder Face</title>
  <style>
    :root {
      --ink: #050505;
      --shell: #111315;
      --dial: #171a1d;
      --ring: #2a2f35;
      --signal: #72d36c;
      --warn: #f58d50;
      --muted: rgba(255, 255, 255, 0.7);
      --soft: rgba(255, 255, 255, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(114, 211, 108, 0.12), transparent 24%),
        radial-gradient(circle at bottom, rgba(245, 141, 80, 0.12), transparent 28%),
        #0b0d0f;
      font-family: "SF Pro Display", "Avenir Next", sans-serif;
      color: white;
      padding: 32px;
    }

    .watch {
      width: 396px;
      height: 486px;
      border-radius: 98px;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.08), transparent 26%),
        linear-gradient(180deg, #1a1e22 0%, #0d0f12 100%);
      box-shadow:
        0 22px 70px rgba(0, 0, 0, 0.48),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .content {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      padding: 26px 24px 24px;
      position: relative;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .status-pill {
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(114, 211, 108, 0.12);
      border: 1px solid rgba(114, 211, 108, 0.24);
      color: var(--signal);
      font-weight: 700;
    }

    .dial-shell {
      display: grid;
      place-items: center;
      position: relative;
    }

    .dial {
      width: 238px;
      height: 238px;
      border-radius: 50%;
      position: relative;
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.07), transparent 18%),
        radial-gradient(circle at 50% 50%, #1a1f23 0%, #121518 55%, #0a0c0f 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow:
        inset 0 0 0 18px rgba(255, 255, 255, 0.02),
        0 18px 34px rgba(0, 0, 0, 0.35);
    }

    .tick {
      position: absolute;
      top: 12px;
      left: 50%;
      width: 2px;
      height: 14px;
      margin-left: -1px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.58);
      transform-origin: 50% 107px;
    }

    .tick.major {
      height: 18px;
      background: rgba(255, 255, 255, 0.82);
    }

    .tick:nth-child(1) { transform: rotate(0deg); }
    .tick:nth-child(2) { transform: rotate(30deg); }
    .tick:nth-child(3) { transform: rotate(60deg); }
    .tick:nth-child(4) { transform: rotate(90deg); }
    .tick:nth-child(5) { transform: rotate(120deg); }
    .tick:nth-child(6) { transform: rotate(150deg); }
    .tick:nth-child(7) { transform: rotate(180deg); }
    .tick:nth-child(8) { transform: rotate(210deg); }
    .tick:nth-child(9) { transform: rotate(240deg); }
    .tick:nth-child(10) { transform: rotate(270deg); }
    .tick:nth-child(11) { transform: rotate(300deg); }
    .tick:nth-child(12) { transform: rotate(330deg); }

    .seconds-hand {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 3px;
      height: 92px;
      margin-left: -1.5px;
      margin-top: -88px;
      border-radius: 3px;
      background: linear-gradient(180deg, var(--warn) 0%, #f4b36b 100%);
      box-shadow: 0 0 18px rgba(245, 141, 80, 0.32);
      transform: rotate(32deg);
      transform-origin: 50% 88px;
    }

    .center-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 16px;
      height: 16px;
      margin-left: -8px;
      margin-top: -8px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.08);
    }

    .time-chip {
      position: absolute;
      right: 12px;
      top: 36px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.05em;
    }

    .label-stack {
      text-align: center;
      margin-top: -8px;
    }

    .label-stack .kicker {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.48);
      margin-bottom: 8px;
    }

    .label-stack h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: -0.06em;
    }

    .label-stack p {
      margin: 8px 0 0;
      font-size: 15px;
      color: rgba(255, 255, 255, 0.66);
    }

    .record-button {
      margin-top: 14px;
      height: 72px;
      border-radius: 999px;
      background:
        linear-gradient(180deg, #82dc78 0%, #5cc45a 100%);
      display: grid;
      place-items: center;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        0 14px 28px rgba(92, 196, 90, 0.24);
    }

    .record-button span {
      font-size: 34px;
      font-weight: 700;
    }

    .hint {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .hint strong {
      color: white;
      font-size: 13px;
      letter-spacing: 0.08em;
    }
   </style>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>
<body>
  <main class="watch">
    <div class="content">
      <div class="top-row">
        <span>Recorder</span>
        <span class="status-pill">Recording</span>
      </div>

      <section class="dial-shell">
        <div class="dial">
          <div class="tick major"></div>
          <div class="tick"></div>
          <div class="tick"></div>
          <div class="tick major"></div>
          <div class="tick"></div>
          <div class="tick"></div>
          <div class="tick major"></div>
          <div class="tick"></div>
          <div class="tick"></div>
          <div class="tick major"></div>
          <div class="tick"></div>
          <div class="tick"></div>
          <div class="seconds-hand"></div>
          <div class="center-dot"></div>
          <div class="time-chip">12:52</div>
        </div>
      </section>

      <section class="label-stack">
        <div class="kicker">Capture Surface</div>
        <h1>Live segment</h1>
        <p>Tap to stop and queue direct upload.</p>
      </section>

      <div>
        <div class="record-button"><span>Stop</span></div>
        <div class="hint">
          <span>Hold crown area</span>
          <strong>Finalize session</strong>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
