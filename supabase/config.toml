[project]
id = "apple-watch-recorder"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "applewatchrecorder://auth-callback"
additional_redirect_urls = ["http://localhost:3000", "applewatchrecorder://auth-callback"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "25MiB"

[edge_runtime]
enabled = true
policy = "per_worker"
